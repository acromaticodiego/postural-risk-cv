<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo postural · Panel de planta</title>
<style>
/* Todo el estilo va aquí, sin CDN. Una librería externa puede tardar o fallar y
   dejar la página sin estilos justo en la toma del vídeo. */
:root{
  --fondo:#0f1214; --panel:#171b1f; --panel2:#1d2226; --borde:#2a3036;
  --texto:#e8eaec; --suave:#8d979f; --tenue:#5d666d;
  --n1:#7dbf6e; --n2:#8fd18a; --n3:#e8b23a; --n4:#e8763a; --n5:#e34b4b;
  --acento:#5aa9e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* La marca y el boton de modo en vivo van CENTRADOS, con el sello de privacidad
   pegado a la derecha. Tres columnas y no `justify-content:center`: con flex, el
   sello —que es mucho mas ancho que el hueco de la izquierda— desplazaba el centro
   hacia la izquierda y el titulo no quedaba centrado de verdad. */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:18px;padding:18px 28px;border-bottom:1px solid var(--borde);
  background:var(--panel)}
header .centro{grid-column:2;display:flex;align-items:center;gap:16px}
header .privacidad{grid-column:3;justify-self:end}
.marca{font-size:15px;font-weight:600}
.marca span{color:var(--acento)}
.privacidad{font-size:12px;color:var(--suave);
  border:1px solid var(--borde);border-radius:999px;padding:5px 14px}
.privacidad b{color:var(--n1);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:28px}
.migas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--suave);
  margin-bottom:20px;min-height:20px}
.migas button{color:var(--acento)}
.migas button:hover{text-decoration:underline}

.titulo{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.titulo h2{font-size:20px}
.sub{color:var(--suave);font-size:13px;margin-bottom:22px}

.rejilla{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:18px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.tarjeta:hover{border-color:var(--acento);transform:translateY(-2px)}
.tarjeta h3{font-size:15px;margin-bottom:2px}
.tarjeta .id{font-size:11px;color:var(--tenue);letter-spacing:1px;margin-bottom:14px}
.cifra{font-size:30px;font-weight:600;line-height:1}
.cifra small{font-size:13px;font-weight:400;color:var(--suave);margin-left:6px}
.pie{font-size:12px;color:var(--suave);margin-top:12px}

.barra{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:14px;
  background:var(--panel2)}
.barra i{display:block}

.aviso{display:inline-block;margin-top:12px;font-size:11px;color:var(--n3);
  border:1px solid rgba(232,178,58,.35);border-radius:6px;padding:3px 9px}

table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-size:11px;letter-spacing:.8px;color:var(--tenue);
  text-transform:uppercase;padding:0 12px 10px 0;font-weight:600}
td{padding:11px 12px 11px 0;border-top:1px solid var(--borde);font-size:13px}
td.num,th.num{text-align:right}
.tarea{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.medidor{display:inline-block;width:110px;height:6px;background:var(--panel2);
  border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:9px}
.medidor i{display:block;height:100%}

.recomendacion{background:var(--panel);border:1px solid var(--borde);
  border-left:3px solid var(--acento);border-radius:8px;padding:16px 18px;margin:22px 0}
.recomendacion h3{font-size:12px;color:var(--tenue);letter-spacing:.8px;
  text-transform:uppercase;margin-bottom:8px}

.evento{display:flex;align-items:center;gap:14px;padding:12px;border-radius:8px;
  border:1px solid var(--borde);background:var(--panel);margin-bottom:8px;width:100%;
  text-align:left}
.evento:hover{border-color:var(--acento)}
.punto{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  font-weight:600;font-size:15px;flex:none;color:#0f1214}
.evento .meta{font-size:12px;color:var(--suave)}

.escena{display:grid;grid-template-columns:1fr 300px;gap:20px;
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:20px}
canvas{width:100%;height:auto;background:var(--fondo);border-radius:8px;
  border:1px solid var(--borde);display:block}
.controles{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:13px;
  color:var(--suave)}
.controles button{border:1px solid var(--borde);border-radius:6px;padding:6px 16px;
  background:var(--panel2)}
.controles button:hover{border-color:var(--acento)}
input[type=range]{flex:1;accent-color:var(--acento)}

.comp{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.comp span:first-child{width:78px;color:var(--suave)}
.comp .medidor{width:100%;flex:1;margin:0}
.grande{font-size:44px;font-weight:600;line-height:1}
.nivel{font-size:13px;letter-spacing:1px;text-transform:uppercase}
.vacio{color:var(--suave);padding:40px;text-align:center}

.enlace-vivo{border:1px solid var(--borde);border-radius:999px;padding:5px 16px;
  font-size:12px;color:var(--n5)}
.enlace-vivo:hover{border-color:var(--n5)}

/* Modo en vivo: las dos vistas, una al lado de la otra. Es el argumento del
   proyecto hecho pantalla — a la izquierda lo que la cámara capta, a la derecha lo
   único que sale del dispositivo. */
.dos-vistas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.caja-vista{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:14px;position:relative}
.caja-vista h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--tenue);margin-bottom:10px}
.caja-vista .nota{font-size:11px;color:var(--suave);margin-top:10px;min-height:28px}
.caja-vista img{width:100%;border-radius:8px;display:block;background:var(--fondo)}
.sello{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:.6px;
  text-transform:uppercase;border-radius:999px;padding:3px 10px}
.sello.efimero{color:var(--n3);border:1px solid rgba(232,178,58,.4)}
.sello.guardado{color:var(--n1);border:1px solid rgba(125,191,110,.4)}

.niosh{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:18px 20px;margin:18px 0}
.niosh h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--tenue);margin-bottom:14px}
.niosh .kilos{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.niosh .kilos b{font-size:30px;font-weight:600}
.factores{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.factor{font-size:11px;border:1px solid var(--borde);border-radius:6px;padding:4px 10px;
  color:var(--suave)}
.factor.malo{color:var(--n4);border-color:rgba(232,118,58,.4)}

.tira{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:14px 22px;margin:0 0 14px}
.tarea-viva{font-family:ui-monospace,Consolas,monospace;font-size:16px}
.carga-viva{margin-top:10px;font-size:12.5px;border-left:3px solid var(--acento);
  padding-left:10px;line-height:1.7}
.carga-viva .tenue{color:var(--tenue)}
.ajustes-vivo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px;
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px 14px}
.ajustes-vivo label{font-size:12.5px;color:var(--suave)}
.ajustes-vivo input,.ajustes-vivo select{font:inherit;color:var(--texto);background:var(--panel2);
  border:1px solid var(--borde);border-radius:6px;padding:5px 8px;width:76px;margin:0 4px}
.ajustes-vivo select{width:auto}
.ajustes-vivo button{background:var(--panel2);border:1px solid var(--borde);border-radius:6px;
  padding:6px 14px}
.ajustes-vivo button:hover{border-color:var(--acento)}
.ajustes-vivo .nota{font-size:11.5px;color:var(--tenue)}
/* --- La vista en vivo ---------------------------------------------------
   Es una PAGINA que scrollea, no un tablero atado al alto de la ventana. Se probo
   lo segundo y se revirtio: con todo compitiendo por los mismos pixeles, algun
   bloque quedaba siempre apretado, y los dos videos —que son lo que hay que ver—
   eran los primeros en pagar. Scrolleando, cada cosa ocupa lo que necesita. */
.consola{display:flex;flex-direction:column;gap:14px}
/* El marcador y los componentes van lado a lado: a todo lo ancho, las barras de los
   componentes se estiran media pantalla y dejan de leerse como barras. */
.cabecera-vivo{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;
  align-items:stretch}

.rail{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.rail.horizontal{flex-direction:row;gap:20px;align-items:flex-start}
.rail .columna-texto{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rail .carga-viva{margin-top:8px}

.marcador-grande{display:flex;flex-direction:column;align-items:flex-start;gap:0;
  padding:0 20px 0 0;border-right:1px solid var(--borde);margin:0;flex:none}
.marcador-grande .cifra{font-size:62px;font-weight:600;line-height:.95;
  font-variant-numeric:tabular-nums}
.marcador-grande .nivel{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;
  font-weight:600}
.marcador-grande .umbral{font-size:11px;color:var(--tenue)}

/* Las dos vistas toman la proporcion de la camara —`--relacion`, que se lee del
   primer fotograma— para que no queden bandas negras, y se limitan en alto para que
   quepan las dos con el marcador sin tener que scrollear en una pantalla normal. */
.escenario{display:block}
.par-vistas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.par-vistas .caja-vista{display:flex;flex-direction:column;padding:14px}
.par-vistas .caja-vista .lienzo-envoltura{aspect-ratio:var(--relacion, 4/3);
  max-height:52vh;width:100%;margin:9px auto 7px;background:#000;border-radius:6px;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.par-vistas img,.par-vistas canvas{width:100%;height:100%;object-fit:contain;
  display:block}
.par-vistas .caja-vista h3{padding-right:96px;margin-bottom:0;line-height:1.3}
.par-vistas .sello{top:12px;right:12px}
.par-vistas .nota{font-size:11px;line-height:1.4;min-height:0;margin:0}

.lateral{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;align-items:start}
.bloque{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:14px 16px}
.bloque > .etiqueta{margin-bottom:8px}
.lateral .aviso{margin:0 0 8px;display:block;padding:6px 10px;line-height:1.4}
.lateral .recomendacion{margin:0}

.barra-puesto{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 20px;border-bottom:1px solid var(--borde);background:var(--panel)}
.barra-puesto label{font-size:12px;color:var(--suave)}
.barra-puesto input,.barra-puesto select{font:inherit;font-size:12.5px;color:var(--texto);
  background:var(--panel2);border:1px solid var(--borde);border-radius:6px;
  padding:4px 7px;width:70px;margin:0 3px}
.barra-puesto select{width:auto}
.barra-puesto button{background:var(--panel2);border:1px solid var(--borde);
  border-radius:6px;padding:5px 13px;font-size:12.5px}
.barra-puesto button:hover{border-color:var(--acento)}
.barra-puesto .nota{font-size:11px;color:var(--tenue);margin-left:auto}
.barra-puesto .estado{font-size:12px;color:var(--suave)}
.etiqueta{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tenue)}
</style>
</head>
<body>
<header>
  <div class="centro">
    <div class="marca">Riesgo postural <span>por visión</span></div>
    <button class="enlace-vivo" id="btn-vivo">● Modo en vivo</button>
  </div>
  <div class="privacidad">Reconstruido de articulaciones · <b>no se guarda ninguna imagen</b></div>
</header>

<main>
  <div class="migas" id="migas"></div>
  <div id="vista"><div class="vacio">Cargando…</div></div>
</main>

<script>
const HUESOS = [[5,6],[11,12],[5,11],[6,12],[5,7],[7,9],[6,8],[8,10],
                [11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
const COLOR = {"despreciable":"--n1","bajo":"--n2","medio":"--n3","alto":"--n4","muy alto":"--n5"};
const NOMBRE_COMP = {trunk:"Tronco",neck:"Cuello",legs:"Piernas",
                     upper_arm:"Brazo",lower_arm:"Antebrazo"};
const MAX_COMP = {trunk:4,neck:3,legs:4,upper_arm:4,lower_arm:2};

let PANEL = null, animacion = null;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = nivel => css(COLOR[nivel] || "--tenue");
const min = s => (s/60).toFixed(1) + " min";
const el = (t, p={}) => Object.assign(document.createElement(t), p);

// --- navegación ------------------------------------------------------------
function ir(vista, ...args){
  if (animacion) { cancelAnimationFrame(animacion); animacion = null; }
  cerrarSocket();   // salir del modo en vivo suelta la camara
  const migas = document.getElementById("migas");
  migas.innerHTML = "";
  if (vista !== "inicio") {
    const b = el("button", {textContent:"Puestos de trabajo"});
    b.onclick = () => ir("inicio");
    migas.append(b);
  }
  if (vista === "evento") {
    migas.append(el("span",{textContent:"›"}));
    const b = el("button", {textContent: args[0].name});
    b.onclick = () => ir("puesto", args[0]);
    migas.append(b, el("span",{textContent:"› Evento"}));
  } else if (vista === "puesto") {
    migas.append(el("span",{textContent:"› " + args[0].name}));
  }
  ({inicio:vistaInicio, puesto:vistaPuesto, evento:vistaEvento})[vista](...args);
}

// --- pantalla 1: el ranking de puestos -------------------------------------
function vistaInicio(){
  const v = document.getElementById("vista");
  v.innerHTML = "";
  v.append(
    el("div",{className:"titulo",innerHTML:"<h2>Puestos de trabajo</h2>"}),
    el("div",{className:"sub",textContent:
      `Ordenados por exposición acumulada. ${PANEL.puestos.length} puestos · datos del ${PANEL.generado}`})
  );

  const rejilla = el("div",{className:"rejilla"});
  for (const p of PANEL.puestos){
    const t = el("button",{className:"tarjeta"});
    t.onclick = () => ir("puesto", p);
    t.append(
      el("h3",{textContent:p.name}),
      el("div",{className:"id",textContent:p.id}),
      el("div",{className:"cifra",innerHTML:
        `${(p.seconds_at_risk/60).toFixed(1)}<small>min en riesgo</small>`})
    );

    const barra = el("div",{className:"barra"});
    const total = p.seconds || 1;
    for (const nivel of ["despreciable","bajo","medio","alto","muy alto"]){
      const s = p.seconds_by_level[nivel] || 0;
      if (s > 0) barra.append(el("i",{style:
        `width:${100*s/total}%;background:${color(nivel)}`}));
    }
    t.append(barra);
    t.append(el("div",{className:"pie",textContent:
      `${p.shifts} turnos · ${min(p.seconds)} observados · ${p.total_events} eventos`}));
    if (!p.configured) t.append(el("div",{className:"aviso",
      textContent:"sin configurar · el riesgo real es mayor"}));
    rejilla.append(t);
  }
  v.append(rejilla);
}

// --- pantalla 2: el informe de un puesto -----------------------------------
function vistaPuesto(p){
  const v = document.getElementById("vista");
  v.innerHTML = "";
  const cfg = p.configured
    ? `carga ${p.config.load_kg} kg · agarre ${p.config.coupling}`
    : "puesto sin configurar";
  v.append(
    el("div",{className:"titulo",innerHTML:`<h2>${p.name}</h2>`}),
    el("div",{className:"sub",textContent:
      `${p.id} · ${cfg} · umbral de acción REBA ${p.config.risk_threshold} · ` +
      `${min(p.seconds)} observados, ${min(p.seconds_at_risk)} en riesgo`}),
    el("div",{className:"recomendacion",innerHTML:
      `<h3>Recomendación</h3>${p.recommendation}`})
  );

  if (p.worst_lift) v.append(tarjetaNiosh(p.worst_lift, p.config.load_kg));

  v.append(el("div",{className:"titulo",innerHTML:"<h2>Riesgo por tarea</h2>"}),
           el("div",{className:"sub",textContent:
             "La que más daño acumula no siempre es la más severa: manda el tiempo."}));

  const tabla = el("table");
  tabla.innerHTML = `<tr><th>Tarea</th><th class="num">Tiempo</th>
    <th class="num">En riesgo</th><th>Aporte al riesgo</th>
    <th class="num">REBA</th><th>Causa</th></tr>`;
  for (const t of p.tasks){
    const fila = el("tr");
    const nivel = t.median_reba >= 11 ? "muy alto" : t.median_reba >= 8 ? "alto"
                : t.median_reba >= 4 ? "medio" : "bajo";
    fila.innerHTML =
      `<td class="tarea">${t.task}</td>
       <td class="num">${(t.seconds_total/60).toFixed(1)} m</td>
       <td class="num">${(t.seconds_at_risk/60).toFixed(1)} m</td>
       <td><span class="medidor"><i style="width:${100*t.share_of_risk}%;
           background:${color(nivel)}"></i></span>${Math.round(100*t.share_of_risk)}%</td>
       <td class="num" style="color:${color(nivel)}">${t.median_reba}</td>
       <td>${NOMBRE_COMP[t.dominant_component] || t.dominant_component}</td>`;
    tabla.append(fila);
  }
  v.append(tabla);

  v.append(el("div",{className:"titulo",style:"margin-top:32px",
             innerHTML:"<h2>Eventos</h2>"}),
           el("div",{className:"sub",textContent:
             `${p.total_events} eventos detectados. Se listan los ${p.events.length} más graves, con su reconstrucción.`}));
  for (const e of p.events){
    const b = el("button",{className:"evento"});
    b.onclick = () => ir("evento", p, e);
    b.append(el("div",{className:"punto",textContent:e.peak_reba,
      style:`background:${color(e.peak_level)}`}));
    b.append(el("div",{innerHTML:
      `<div class="tarea">${e.task}</div>
       <div class="meta">${e.shift} · t+${e.start_seconds.toFixed(1)}s ·
        ${e.duration_seconds.toFixed(1)}s ·
        causa: ${NOMBRE_COMP[e.dominant_component]}</div>`}));
    v.append(b);
  }
}

function tarjetaNiosh(n, pesoReal){
  const caja = el("div",{className:"niosh"});
  const indice = n.lifting_index;
  const c = indice == null ? css("--suave")
          : indice <= 1 ? css("--n1") : indice <= 2 ? css("--n3")
          : indice <= 3 ? css("--n4") : css("--n5");
  const veredicto = indice == null ? "sin peso declarado"
          : indice <= 1 ? "dentro de lo recomendado" : indice <= 2 ? "por encima de lo recomendado"
          : indice <= 3 ? "riesgo alto" : "riesgo muy alto";

  caja.append(el("h3",{textContent:"Levantamiento · ecuación NIOSH"}));
  caja.append(el("div",{className:"kilos",innerHTML:
    `<b style="color:${c}">${n.recommended_weight_kg} kg</b>
     <span class="sub" style="margin:0">es el peso que sería aceptable levantar así` +
     (pesoReal ? `, y la carga declarada pesa <b style="font-size:14px">${pesoReal} kg</b>` : "") +
     `</span>`}));
  if (indice != null) caja.append(el("div",{style:`color:${c};font-size:13px`,
    textContent:`índice ${indice} · ${veredicto}`}));

  const medidas = el("div",{className:"sub",style:"margin:12px 0 0",textContent:
    `carga a ${n.horizontal_cm} cm del cuerpo · a ${n.vertical_cm} cm del suelo · ` +
    `sube ${n.travel_cm} cm · ${n.frequency_per_min} levantamientos/min`});
  caja.append(medidas);

  const factores = el("div",{className:"factores"});
  const NOMBRES = {horizontal:"distancia al cuerpo", vertical:"altura de inicio",
                   recorrido:"recorrido vertical", asimetria:"torsión",
                   frecuencia:"frecuencia", agarre:"agarre"};
  const peor = Object.keys(n.multipliers).reduce((a,b) =>
    n.multipliers[a] < n.multipliers[b] ? a : b);
  for (const [clave, valor] of Object.entries(n.multipliers)){
    factores.append(el("span",{className:"factor" + (clave === peor ? " malo" : ""),
      textContent:`${NOMBRES[clave] || clave} ×${valor.toFixed(2)}`}));
  }
  caja.append(factores);
  caja.append(el("div",{className:"sub",style:"margin:12px 0 0",textContent:
    `El factor que más penaliza es «${NOMBRES[peor]}». ` +
    (peor === "horizontal"
      ? "Acercar la carga al cuerpo es la intervención con más efecto."
      : "Es donde más margen hay para mejorar.") +
    (n.scale_estimated ? " Estatura del trabajador no declarada: medidas estimadas." : "") +
    (n.frequency_estimated ? " Frecuencia estimada de la grabación, no declarada." : "")}));
  return caja;
}

// --- pantalla 3: el replay en esqueleto ------------------------------------
function vistaEvento(p, e){
  const v = document.getElementById("vista");
  v.innerHTML = "";
  v.append(el("div",{className:"titulo",innerHTML:`<h2>${e.task}</h2>`}),
           el("div",{className:"sub",textContent:
             `${p.name} · ${e.shift} · t+${e.start_seconds.toFixed(1)}s · ` +
             `${e.duration_seconds.toFixed(1)} s · pico REBA ${e.peak_reba}`}));

  const escena = el("div",{className:"escena"});
  const izq = el("div");
  const lienzo = el("canvas",{width:640,height:520});
  izq.append(lienzo);

  const controles = el("div",{className:"controles"});
  const play = el("button",{textContent:"Pausa"});
  const barra = el("input",{type:"range",min:0,max:e.keypoints.length-1,value:0});
  const reloj = el("span");
  controles.append(play, barra, reloj);
  izq.append(controles);

  const der = el("div");
  const puntaje = el("div",{className:"grande"});
  const nivel = el("div",{className:"nivel",style:"margin-bottom:22px"});
  const comps = el("div");
  der.append(puntaje, nivel, comps);

  escena.append(izq, der);
  v.append(escena);
  v.append(el("div",{className:"sub",style:"margin-top:16px",textContent:
    "Esto es todo lo que el sistema conserva del incidente: la posición de las " +
    "articulaciones. No existe ninguna imagen que mostrar."}));

  if (e.niosh) v.append(tarjetaNiosh(e.niosh, p.config.load_kg));

  const ctx = lienzo.getContext("2d");
  let i = 0, corriendo = true;

  function pinta(){
    const pts = e.keypoints[i], reba = e.reba[i];
    const lvl = reba >= 11 ? "muy alto" : reba >= 8 ? "alto"
              : reba >= 4 ? "medio" : reba >= 2 ? "bajo" : "despreciable";
    const c = color(lvl);

    ctx.fillStyle = css("--fondo");
    ctx.fillRect(0,0,lienzo.width,lienzo.height);
    ctx.strokeStyle = css("--borde"); ctx.lineWidth = 1;
    for (let g = 0; g <= lienzo.width; g += 64){
      ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,lienzo.height); ctx.stroke();
    }
    for (let g = 0; g <= lienzo.height; g += 64){
      ctx.beginPath(); ctx.moveTo(0,g); ctx.lineTo(lienzo.width,g); ctx.stroke();
    }

    // El esqueleto llega en 0..1: se estira al lienzo con el mismo factor en los
    // dos ejes, que es lo que conserva los ángulos del cuerpo.
    const escala = Math.min(lienzo.width, lienzo.height) * 0.8;
    const dx = (lienzo.width - escala)/2, dy = (lienzo.height - escala)/2;
    const X = k => pts[k][0]*escala + dx, Y = k => pts[k][1]*escala + dy;

    ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineCap = "round";
    for (const [a,b] of HUESOS){
      if ((pts[a][0]===0&&pts[a][1]===0) || (pts[b][0]===0&&pts[b][1]===0)) continue;
      ctx.beginPath(); ctx.moveTo(X(a),Y(a)); ctx.lineTo(X(b),Y(b)); ctx.stroke();
    }
    ctx.fillStyle = c;
    for (let k = 0; k < pts.length; k++){
      if (pts[k][0]===0 && pts[k][1]===0) continue;
      ctx.beginPath(); ctx.arc(X(k),Y(k),5,0,7); ctx.fill();
    }

    puntaje.textContent = reba;
    puntaje.style.color = c;
    nivel.textContent = lvl;
    nivel.style.color = c;

    comps.innerHTML = "";
    for (const [clave, etiqueta] of Object.entries(NOMBRE_COMP)){
      const valor = e.components[i][clave];
      const fila = el("div",{className:"comp"});
      fila.innerHTML = `<span>${etiqueta}</span>
        <span class="medidor"><i style="width:${100*Math.min(valor/MAX_COMP[clave],1)}%;
          background:${valor/MAX_COMP[clave] >= .75 ? css("--n4") : css("--n3")}"></i></span>
        <span>${valor}</span>`;
      comps.append(fila);
    }
    barra.value = i;
    reloj.textContent = `${(i/PANEL.hz).toFixed(1)} s`;
  }

  let ultimo = 0;
  function bucle(t){
    if (corriendo && t - ultimo > 1000/PANEL.hz){
      i = (i + 1) % e.keypoints.length;
      ultimo = t; pinta();
    }
    animacion = requestAnimationFrame(bucle);
  }
  play.onclick = () => { corriendo = !corriendo; play.textContent = corriendo ? "Pausa" : "Reproducir"; };
  barra.oninput = () => { corriendo = false; play.textContent = "Reproducir"; i = +barra.value; pinta(); };
  pinta();
  animacion = requestAnimationFrame(bucle);
}

// --- pantalla 4: el sistema funcionando en vivo ----------------------------
let socket = null;

function cerrarSocket(){
  if (socket) { socket.onclose = null; socket.close(); socket = null; }
}

function vistaEnVivo(){
  cerrarSocket();
  if (animacion) { cancelAnimationFrame(animacion); animacion = null; }
  const migas = document.getElementById("migas");
  migas.innerHTML = "";
  const atras = el("button",{textContent:"Puestos de trabajo"});
  atras.onclick = () => { cerrarSocket(); ir("inicio"); };
  migas.append(atras, el("span",{textContent:"› En vivo"}));

  const v = document.getElementById("vista");
  v.innerHTML = "";

  // La barra del puesto va pegada arriba y es fina: se toca una vez al empezar y
  // despues solo estorba. Lo que la camara NO puede ver se declara, no se adivina
  // (ADR 0001): sin estatura la caja detectada no tiene con que medirse.
  const ajustes = el("div",{className:"barra-puesto"});
  ajustes.innerHTML = `
    <label>Estatura <input id="v-altura" type="number" value="172" min="120" max="220"> cm</label>
    <label>Carga <input id="v-peso" type="number" value="12" min="0" max="50" step="0.5"> kg</label>
    <label>Agarre <select id="v-agarre">
      <option value="good">bueno</option>
      <option value="fair" selected>regular</option>
      <option value="poor">malo</option>
      <option value="unacceptable">inaceptable</option>
    </select></label>
    <button id="v-aplicar">Aplicar</button>
    <span class="estado" id="estado-vivo">Conectando con la cámara…</span>
    <span class="nota">El peso y el agarre los declara quien conoce el puesto.</span>`;
  v.append(ajustes);

  const consola = el("div",{className:"consola"});

  // --- columna 1: el marcador. Es lo que decide el sistema, y por eso es lo
  // primero que se lee: en el video de demostracion el REBA tiene que verse a la
  // vez que el cuerpo que lo produce.
  const rail = el("div",{className:"rail horizontal"});
  const marcador = el("div",{className:"marcador-grande"});
  const puntaje = el("div",{className:"cifra",textContent:"—"});
  const textoNivel = el("div",{className:"texto"});
  const nivel = el("div",{className:"nivel",textContent:"—"});
  const umbral = el("div",{className:"umbral",id:"v-umbral",textContent:""});
  textoNivel.append(nivel, umbral);
  marcador.append(puntaje, textoNivel);

  const tarea = el("div",{className:"tarea-viva",textContent:"—"});
  const avisoTarea = el("div",{className:"aviso",style:"display:none"});
  const avisoVista = el("div",{className:"aviso",style:"display:none"});
  const carga = el("div",{className:"carga-viva",style:"display:none"});
  const columnaTexto = el("div",{className:"columna-texto"});
  columnaTexto.append(el("div",{className:"etiqueta",textContent:"Tarea reconocida"}),
                      tarea, carga);
  rail.append(marcador, columnaTexto);

  // Los componentes van en su PROPIA columna de la franja. Debajo del marcador se
  // salian por abajo, y son justo lo que explica de donde sale el puntaje: el panel
  // que dice "REBA 8" sin decir "porque el tronco va a 4" no sirve de consejo.
  const bloqueComps = el("div",{className:"rail"});
  const comps = el("div");
  bloqueComps.append(el("div",{className:"etiqueta",textContent:"Componentes REBA"}), comps);

  // --- columna 2: las dos vistas. Nunca se salen de cuadro, porque la
  // comparacion entre lo que la camara capta y lo que el sistema conserva ES el
  // argumento del producto.
  const escenario = el("div",{className:"escenario"});
  const dos = el("div",{className:"par-vistas"});

  const izq = el("div",{className:"caja-vista",innerHTML:
    `<h3>Lo que capta la cámara</h3><div class="sello efimero">efímero</div>`});
  const envIzq = el("div",{className:"lienzo-envoltura"});
  const img = el("img");
  envIzq.append(img);
  izq.append(envIzq, el("div",{className:"nota",textContent:
    "Efímera: no se escribe en disco ni sale del equipo."}));

  const der = el("div",{className:"caja-vista",innerHTML:
    `<h3>Lo único que sale del dispositivo</h3><div class="sello guardado">se conserva</div>`});
  const envDer = el("div",{className:"lienzo-envoltura"});
  const lienzo = el("canvas",{width:640,height:360});
  envDer.append(lienzo);
  der.append(envDer, el("div",{className:"nota",textContent:
    "Articulaciones y puntajes: con esto se reconstruye el incidente, sin ninguna cara."}));

  dos.append(izq, der);
  escenario.append(dos);

  // --- columna 3: lo que crece. Es lo unico que scrollea.
  const lateral = el("div",{className:"lateral"});
  const consejo = el("div",{className:"recomendacion",style:"display:none"});
  const nioshVivo = el("div");
  const cajaEventos = el("div",{className:"bloque"});
  const listaEventos = el("div");
  cajaEventos.append(el("div",{className:"etiqueta",textContent:"Eventos detectados"}),
                     el("div",{className:"sub",id:"conteo-eventos",style:"margin:0 0 10px",
                       textContent:"Ninguno todavía. Aparecen cuando una postura de riesgo se sostiene un segundo."}),
                     listaEventos);
  // Dos columnas de verdad: el consejo y NIOSH a un lado, los eventos al otro. Sin
  // agruparlos, el div vacio de NIOSH ocupaba una columna entera y los eventos se
  // apilaban debajo del consejo dejando media franja en negro.
  // Los avisos —angulo no entrenado, camara de frente, oclusion— viven AQUI y no
  // junto al marcador. Son de largo variable: dos a la vez empujaban la tarea y la
  // carga fuera de la franja, y eso es lo que se veia montado. Ademas encajan mejor
  // aqui, porque son mensajes al operario igual que el consejo de tecnica.
  const columnaConsejo = el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  columnaConsejo.append(avisoTarea, avisoVista, consejo, nioshVivo);
  lateral.append(columnaConsejo, cajaEventos);

  // Orden de lectura, de arriba abajo: primero QUE decide el sistema (el marcador
  // con el puntaje, la tarea y la carga), despues CON QUE lo decide (las dos vistas),
  // y por ultimo lo que crece —avisos, consejo, NIOSH y eventos—.
  const cabecera = el("div",{className:"cabecera-vivo"});
  cabecera.append(rail, bloqueComps);
  consola.append(cabecera, escenario, lateral);
  v.append(consola);

  // Los dos cuadros toman la forma de la CAMARA, no al reves: con un 16/9 escrito a
  // mano, una webcam de 4:3 dejaba bandas negras a los lados y se perdia mucho video.
  //
  // Va en el `load` de la imagen y no justo despues de asignar `src`: ahi la imagen
  // todavia no se ha decodificado y `naturalWidth` es 0, asi que la proporcion no se
  // aplicaba nunca. Y una sola vez, porque redimensionar el lienzo lo borra.
  let relacionFijada = false;
  img.onload = () => {
    if (relacionFijada || !img.naturalWidth) return;
    const r = img.naturalWidth / img.naturalHeight;
    dos.style.setProperty("--relacion", r.toFixed(4));
    // El lienzo del esqueleto se iguala al de la camara para que los dos paneles sean
    // el MISMO rectangulo: la comparacion entre ambos es el argumento del producto, y
    // con dos formas distintas se lee peor.
    lienzo.width = 720;
    lienzo.height = Math.round(720 / r);
    relacionFijada = true;
  };

  const ctx = lienzo.getContext("2d");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const params = () => new URLSearchParams({
    id: "EN-VIVO", name: "Camara en vivo",
    height_cm: document.getElementById("v-altura").value,
    load_kg: document.getElementById("v-peso").value,
    coupling: document.getElementById("v-agarre").value,
  }).toString();
  document.getElementById("v-aplicar").onclick = () => { if (socket) socket.close(); vistaVivo(); };
  socket = new WebSocket(`${proto}://${location.host}/ws/live?${params()}`);
  socket.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.error){
      document.getElementById("estado-vivo").textContent = "Error: " + d.error;
      return;
    }
    document.getElementById("estado-vivo").textContent =
      `${d.seconds.toFixed(0)} s procesados` +
      (d.configured ? "" : " · puesto sin configurar: el riesgo real es mayor");
    document.getElementById("v-umbral").textContent = `umbral de acción ${d.threshold}`;

    if (d.preview) img.src = "data:image/jpeg;base64," + d.preview;

    const c = d.present ? color(d.level) : css("--tenue");
    ctx.fillStyle = css("--fondo");
    ctx.fillRect(0,0,lienzo.width,lienzo.height);
    ctx.strokeStyle = css("--borde"); ctx.lineWidth = 1;
    for (let g = 0; g <= lienzo.width; g += 48){
      ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,lienzo.height); ctx.stroke(); }
    for (let g = 0; g <= lienzo.height; g += 48){
      ctx.beginPath(); ctx.moveTo(0,g); ctx.lineTo(lienzo.width,g); ctx.stroke(); }

    if (d.skeleton){
      const escala = Math.min(lienzo.width, lienzo.height);
      const dx = (lienzo.width - escala)/2, dy = (lienzo.height - escala)/2;
      const X = k => d.skeleton[k][0]*escala + dx, Y = k => d.skeleton[k][1]*escala + dy;
      ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.lineCap = "round";
      for (const [a,b] of HUESOS){
        if ((d.skeleton[a][0]===0&&d.skeleton[a][1]===0) ||
            (d.skeleton[b][0]===0&&d.skeleton[b][1]===0)) continue;
        ctx.beginPath(); ctx.moveTo(X(a),Y(a)); ctx.lineTo(X(b),Y(b)); ctx.stroke();
      }
      ctx.fillStyle = c;
      for (let k = 0; k < d.skeleton.length; k++){
        if (d.skeleton[k][0]===0 && d.skeleton[k][1]===0) continue;
        ctx.beginPath(); ctx.arc(X(k),Y(k),4,0,7); ctx.fill();
      }

      // La carga va EN ESTA VISTA, no solo sobre la camara. Esta columna es "lo
      // unico que sale del dispositivo", y si el sistema aplica el peso de una caja
      // que vio, la caja tiene que estar en lo que se conserva: si no, el replay de
      // un incidente no podria explicar de donde salio ese peso.
      if (d.load && d.load.canvas && d.load.canvas.length > 2){
        const q = d.load.canvas;
        ctx.strokeStyle = css("--acento"); ctx.lineWidth = 3; ctx.setLineDash([6,4]);
        ctx.beginPath();
        ctx.moveTo(q[0][0]*escala + dx, q[0][1]*escala + dy);
        for (let i = 1; i < q.length; i++) ctx.lineTo(q[i][0]*escala + dx, q[i][1]*escala + dy);
        ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);

        // La etiqueta tambien aqui: esta vista es la que se conserva, y un contorno
        // sin nombre no explica por si solo de donde salio el peso aplicado.
        const xs = q.map(pt => pt[0]*escala + dx), ys = q.map(pt => pt[1]*escala + dy);
        const bx = Math.min(...xs), by = Math.min(...ys);
        const texto = "caja" + (d.load.width_cm ? ` · ${d.load.width_cm} cm` : "");
        ctx.font = "11px ui-monospace, Consolas, monospace";
        const w = ctx.measureText(texto).width;
        ctx.fillStyle = css("--acento");
        ctx.fillRect(bx, Math.max(by - 15, 0), w + 10, 14);
        ctx.fillStyle = css("--fondo");
        ctx.fillText(texto, bx + 5, Math.max(by - 4, 11));
      }
    } else {
      ctx.fillStyle = css("--suave"); ctx.font = "14px system-ui";
      ctx.fillText("sin persona en cuadro", 20, lienzo.height - 20);
    }

    puntaje.textContent = d.present ? d.reba : "—";
    puntaje.style.color = c;
    nivel.textContent = d.level;
    nivel.style.color = c;
    tarea.textContent = d.task;

    // La carga vista. Si no se ve ninguna se dice, en vez de dejar el hueco de
    // antes: "no hay caja en las manos" y "el detector no esta puesto" son dos
    // cosas distintas y la demo tiene que poder distinguirlas.
    if (d.load){
      const medida = d.load.width_cm ? `${d.load.width_cm} cm de ancho` : "sin escala declarada";
      const peso = d.load.weight_kg ? ` · ${d.load.weight_kg} kg (${d.load.matched})` : "";
      carga.innerHTML = `<b>Carga detectada</b> · ${medida}${peso}
        <span class="tenue">· confianza ${d.load.confidence}</span>`;
      carga.style.display = "block";
    } else {
      carga.innerHTML = `<span class="tenue">Sin carga en las manos</span>`;
      carga.style.display = "block";
    }

    if (d.task_warning){
      avisoTarea.textContent = "⚠ " + d.task_warning;
      avisoTarea.style.display = "inline-block";
      tarea.style.opacity = ".45";
    } else {
      avisoTarea.style.display = "none";
      tarea.style.opacity = "1";
    }

    // Un componente cuyas articulaciones no se ven se muestra atenuado y con un
    // interrogante: es preferible decir «esto no se sabe» a enseñar un puntaje
    // sacado de una articulación que estaba tapada.
    const dudosos = new Set(d.unreliable || []);
    comps.innerHTML = "";
    for (const [clave, etiqueta] of Object.entries(NOMBRE_COMP)){
      const valor = d.components[clave] || 0;
      const dudoso = dudosos.has(clave);
      const fila = el("div",{className:"comp", style: dudoso ? "opacity:.4" : ""});
      fila.innerHTML = `<span>${etiqueta}</span>
        <span class="medidor"><i style="width:${100*Math.min(valor/MAX_COMP[clave],1)}%;
          background:${dudoso ? css("--tenue") : (valor/MAX_COMP[clave] >= .75 ? css("--n4") : css("--n3"))}"></i></span>
        <span>${dudoso ? "?" : valor}</span>`;
      fila.title = dudoso ? "articulaciones no visibles en este fotograma" : "";
      comps.append(fila);
    }
    if (d.frontal_view){
      avisoVista.textContent = "⚠ camara de frente: la flexion de la espalda NO se puede medir desde aqui. Coloca la camara de lado.";
      avisoVista.style.display = "inline-block";
    } else if (d.partial){
      avisoVista.textContent = "⚠ oclusion: " + (d.unreliable||[]).map(c => NOMBRE_COMP[c]||c).join(", ");
      avisoVista.style.display = "inline-block";
    } else {
      avisoVista.style.display = "none";
    }

    if (d.technique && d.technique.code !== "neutra"){
      const evitable = d.technique.avoidable;
      consejo.style.display = "block";
      consejo.style.borderLeftColor = evitable ? css("--n4") : css("--n1");
      consejo.innerHTML =
        `<h3>${evitable ? "Se puede evitar" : "Es el mínimo de esta tarea"}</h3>` +
        d.technique.message;
    } else {
      consejo.style.display = "none";
    }

    const ultimoLift = [...d.events].reverse().find(e => e.niosh);
    nioshVivo.innerHTML = "";
    if (ultimoLift) nioshVivo.append(tarjetaNiosh(ultimoLift.niosh, null));

    if (d.total_events){
      document.getElementById("conteo-eventos").textContent =
        `${d.total_events} eventos. Se muestran los últimos.`;
      listaEventos.innerHTML = "";
      for (const e of [...d.events].reverse()){
        const fila = el("div",{className:"evento"});
        fila.append(el("div",{className:"punto",textContent:e.peak_reba,
          style:`background:${color(e.peak_level)}`}));
        fila.append(el("div",{innerHTML:
          `<div class="tarea">${e.task}</div>
           <div class="meta">t+${e.start_seconds}s · ${e.duration_seconds}s ·
            causa: ${NOMBRE_COMP[e.dominant_component] || e.dominant_component}</div>`}));
        listaEventos.append(fila);
      }
    }
  };
  socket.onerror = () => {
    document.getElementById("estado-vivo").textContent =
      "No se pudo abrir la cámara. ¿Está conectada y libre?";
  };
  socket.onclose = () => {
    const e = document.getElementById("estado-vivo");
    if (e && !e.textContent.startsWith("Error")) e.textContent += " · conexión cerrada";
  };
}

document.getElementById("btn-vivo").onclick = vistaEnVivo;

fetch("/api/panel").then(r => r.json()).then(d => { PANEL = d; ir("inicio"); })
  .catch(() => document.getElementById("vista").innerHTML =
    '<div class="vacio">No hay datos. Corre <code>python scripts/build_demo_data.py</code></div>');
</script>
